      { t:'증상이 없을 수 있음', say:'"조금 낮을 때는 아무렇지 않아서 피검사를 꼭 받으셔야 해요."', why:'125 mEq/L 이상에서는 의미 있는 증상이 거의 없고 120~125 미만에서 증상이 나타나기 쉽습니다. 저나트륨혈증은 대부분 자각 증상이 거의 없습니다.', s:[1, 2] },
      { t:'빠르게 떨어질 때의 위험', say:'"갑자기 멍해지고 토하시면 바로 응급실로 가셔야 해요."', why:'48시간 이내에 빠르게 생기면 증상이 급격히 심해질 수 있고, 급성 저나트륨혈증은 뇌세포 부종 등 위험한 합병증을 일으킬 수 있어 즉각적인 치료가 필요합니다. 중증 저나트륨혈증은 응급 상황입니다.', s:[1, 5] },
      { t:'물 양 지키기', say:'"의사 선생님이 정해 준 물 양만 드세요."', why:'SIADH·갑상선기능저하증·부신기능부전처럼 체액 손실 없이 생긴 경우 하루 800~1,000mL로 수분을 제한하고, 심부전·간경변·신부전은 하루 1.5L 이하를 권장합니다. 짧은 시간에 물을 많이 마시면 나트륨이 희석됩니다. 반대로 구토·설사·이뇨제로 체액이 부족한 경우는 수액으로 보충합니다.', s:[1] },
      { t:'소금으로 스스로 올리지 않기', say:'"소금을 일부러 더 드시면 안 돼요. 원인마다 치료가 달라요."', why:'식단은 원인에 따라 달라집니다. 나트륨을 너무 빨리 올리면 심각하고 종종 영구적인 뇌 손상이 생길 수 있어 의료기관에서 천천히 교정합니다. 알코올과 카페인은 수분 균형에 영향을 줄 수 있어 제한합니다.', s:[1, 5] },
      { t:'원인 약물', say:'"소변 보게 하는 혈압약을 드시면 나트륨이 낮아질 수 있어요. 끊지 마시고 의사와 상의하세요."', why:'티아지드 이뇨제가 특히 잘 일으키며 나이가 많고 신기능이 떨어진 환자에서 더 흔합니다. 고리 이뇨제는 과용량일 때, SSRI 항우울제는 사용 초기 몇 주 안에 노인에서 주의가 필요합니다. 노인에서는 이런 부작용이 더 쉽게 생기므로 이상 증상이 있으면 담당 의사나 약사와 상의합니다.', s:[1, 3, 5] }
    ]
  },
  electrolyte: {
    extra: [],
    items: [
      { t:'전해질 불균형이란', say:'"피 속 소금기(나트륨)나 칼륨이 너무 적거나 많은 거예요. 피검사로 알 수 있어요."', why:'혈중 나트륨 135 미만은 저나트륨혈증, 145 이상은 고나트륨혈증입니다. 칼륨은 3.5~5.5 mmol/L가 정상이며 3.5 미만은 저칼륨혈증, 5.5 이상은 고칼륨혈증입니다. 가장 흔한 것은 저나트륨혈증이며, 나트륨이 줄었다기보다 나트륨에 비해 수분이 과다한 상태입니다.', s:[1, 2, 3, 5] },
      { t:'증상이 없을 수 있음', say:'"처음엔 아무렇지 않을 수 있어서 피검사를 꼭 받으셔야 해요."', why:'나트륨 125 mEq/L 이상에서는 의미 있는 증상이 거의 없고 120~125 미만에서 증상이 나타나기 쉽습니다. 48시간 이내에 빠르게 생기면 뇌부종 등 위험한 합병증이 생길 수 있습니다. 고칼륨혈증도 초기에는 증상이 없을 수 있습니다.', s:[1, 3] },
      { t:'노인과 저나트륨혈증', say:'"멍해지거나 자꾸 넘어지시면 나트륨이 낮은 건 아닌지 확인해 봐야 해요."', why:'초기 증상은 기면·혼돈이며 메스꺼움과 균형 감각 상실이 생길 수 있습니다. 악화되면 근육 수축, 발작, 혼수가 올 수 있고, 노인은 중증 증상이 생기기 쉬우며 낙상 병력이 있기도 합니다.', s:[8] },
      { t:'원인이 되는 약', say:'"소변 보게 하는 약이나 우울증 약을 드시면 나트륨을 가끔 확인해 보시는 게 좋아요."', why:'티아지드 이뇨제는 나이가 많고 신기능이 떨어진 환자에서 저나트륨혈증을 잘 일으키고, SSRI 항우울제는 사용 초기 몇 주 안에 노인에서 주의가 필요합니다. ACE 억제제와 ARB는 고칼륨혈증을 일으킬 수 있고 노인에서 더 쉽게 생깁니다. 이상 증상이 있으면 담당 의사·약사와 상의합니다.', s:[1, 6] },
      { t:'물 마시기', say:'"목이 안 말라도 물을 챙겨 드세요. 다만 물을 줄이라는 말을 들으셨으면 정해 준 양만 드세요."', why:'고령자는 갈증 감각이 둔하고 요실금 걱정·치매 등으로 수분 섭취를 줄이기 쉽습니다. 권장량은 체중×30mL, 건강한 성인 하루 1.5~2L입니다. 반면 저나트륨혈증의 원인에 따라 수분을 하루 800~1,000mL로 제한하거나, 심부전·간경변·신부전에서 1.5L 이하로 제한합니다. 짧은 시간의 과도한 수분 섭취는 나트륨을 희석합니다.', s:[4, 1] },
      { t:'설사·구토 때 수분 보충', say:'"설사하실 땐 물만 드시지 말고 약국의 수분 보충액을 드세요."', why:'구토·설사·발열 때는 전해질이 포함된 음료가 좋습니다. 구토·설사로 인한 탈수에는 경구 수분 보충 용액이 효과적이고, 스포츠음료는 전해질이 충분하지 않아 대체하기 어렵습니다. 알코올·카페인 음료는 이뇨 작용이 있어 제한합니다.', s:[4, 9] },
      { t:'탈수의 단계와 이송', say:'"물도 못 드시고 소변이 거의 안 나오면 바로 병원에 가셔야 해요."', why:'체중 3~5% 감소 경도, 6~9% 중등도(점막 건조, 소변량 감소, 기립 시 혈압 저하와 맥박 증가), 10% 이상 중증(저혈압·쇼크, 소변 거의 없음, 의식 저하). 생체징후가 불안정하거나 경구 섭취가 어려우면 정맥 수액이 필요하고, 중등도 이상은 즉시 119로 이송합니다.', s:[4] },
      { t:'칼륨을 줄이는 조리법', say:'"채소는 물에 두 시간 이상 담갔다가, 데친 물은 버리고 요리하세요."', why:'칼륨은 물에 녹으므로 물 10배 양에 2시간 이상 담근 뒤 사용하고, 끓는 물에 데쳐 여러 번 헹군 뒤 데친 물을 버립니다. 껍질과 줄기에 칼륨이 많습니다. 저염소금과 저염 간장에는 칼륨이 많아 사용 전에 함량을 확인합니다. 칼륨이 대변으로 나가도록 변비를 예방합니다.', s:[7, 3] },
      { t:'칼륨 이상의 위험', say:'"가슴이 두근거리거나 맥이 불규칙하면 바로 병원에 가세요."', why:'저칼륨혈증은 근력약화·근육경련·변비를 일으키고 부정맥과 심정지가 가장 위험합니다. 2 mmol/L 이하에서는 심한 근육 마비가 올 수 있습니다. 고칼륨혈증도 근력 약화, 마비, 부정맥, 급성 심정지로 이어질 수 있습니다.', s:[2, 3] }
    ]
  },
  cad: {
    extra: [],
    items: [
      { t:'협심증과 심근경색의 차이', say:'"심장 혈관이 좁아져 잠깐 아프다 마는 게 협심증이고, 막혀서 계속 아픈 게 심근경색이에요."', why:'협심증 통증은 보통 수 분 안에 최고에 이른 뒤 휴식이나 니트로글리세린으로 수 분 안에 가라앉습니다. 심근경색은 가슴 한가운데 통증이 30분 이상 지속되고 휴식이나 니트로글리세린으로 좋아지지 않습니다.', s:[1, 2] },
      { t:'5분 기준과 119', say:'"약을 넣고 5분이 지나도 그대로면 한 알 더 넣고 바로 119에 전화하세요. 직접 운전은 안 돼요."', why:'흉통이 5분 이상 지속되면 한 알을 더 혀 밑에 넣고 즉시 응급 구조를 요청합니다. 심근경색은 6시간 이내 도착해야 심장 괴사를 줄이고, 직접 운전하지 말고 가족을 기다리지 않으며 야간·주말에도 미루지 않습니다.', s:[5, 2, 3] },
      { t:'니트로글리세린 보관', say:'"늘 지니고 다니시고, 혀에 넣었을 때 톡 쏘는 맛이 없으면 새 약으로 바꾸세요."', why:'갈색 등 햇빛을 막는 용기에 보관하고 유효기일을 확인하며, 톡 쏘는 맛이 없으면 교체합니다. 스프레이는 보통 약 100회 사용할 수 있습니다.', s:[4] },
      { t:'항혈소판제를 끊으면 안 되는 이유', say:'"이 약이 스텐트 안에 피가 굳는 걸 막아 줘요. 끊으면 심근경색이 올 수 있어요."', why:'항혈소판제는 스텐트나 이식 혈관의 혈전을 막아 평생 유지를 권합니다. 임의로 중단하면 스텐트 내 혈전으로 심근경색이 생길 수 있습니다. 내시경·치과 같은 저위험 시술은 5~7일 중단 후 시행할 수 있으나 반드시 주치의와 미리 상의합니다.', s:[6, 4] },
      { t:'발기부전 치료제 병용 금기', say:'"협심증약을 드시면 발기부전 약을 같이 쓰시면 안 돼요. 혈압이 많이 떨어져요."', why:'니트로글리세린·이소소르비드 질산염 등 질산염 협심증약을 정기적으로 또는 가끔이라도 복용하는 환자에게는 발기부전 치료제를 투여하지 않습니다. 혈압이 과도하게 떨어질 수 있습니다.', s:[8] },
      { t:'운동을 시작하는 방법', say:'"처음엔 10분씩 하루 두세 번 걷고, 괜찮으면 조금씩 늘리세요. 가슴이 아프면 바로 멈추세요."', why:'낮은 강도(최대 심박수의 40~65%)로 시작해 30~40분 지속하되, 처음에는 1회 10분씩 하루 2~3회로 나누고 주 3~4회 이상 합니다. 시술 직후 1~2주는 무리한 운동을 피합니다. 운동 전후 5~10분 준비·정리운동을 하고, 흉통·호흡곤란이 있으면 즉시 중단합니다. 숨을 참고 무거운 물건을 드는 동작은 혈압을 높입니다.', s:[1, 6, 7] },
      { t:'추위 주의', say:'"추운 새벽에 갑자기 밖에 나가지 마세요."', why:'이른 아침이나 새벽에 갑자기 추위에 노출되면 관상동맥이 수축해 심한 증상이 나타날 수 있습니다.', s:[1, 4] },
      { t:'식사와 생활 수칙', say:'"국물을 줄여 싱겁게 드시고, 담배는 꼭 끊으세요."', why:'나트륨(소금) 하루 5g 미만, 기름기·당분 줄이기, 식이섬유 충분히. 심근경색 예방으로는 소금 1일 5g 이하, 채소·과일·잡곡, 금연·절주, 한 번에 30분 이상 주 3일 이상 유산소 운동을 권합니다.', s:[1, 2, 3] },
      { t:'건강식품', say:'"건강식품은 드시기 전에 먼저 물어봐 주세요."', why:'관상동맥질환에 확실한 효과가 입증된 건강식품은 없습니다. 오메가3는 중성지방을 낮추지만 심방세동 위험을 높일 수 있다는 보고가 있어 적극 권하지 않습니다. 우황청심환 등 민간요법도 효과가 증명되지 않았습니다.', s:[6, 4] }
    ]
  },
  rectocele: {
    extra: [],
    items: [
      { t:'직장류란', say:'"항문 앞쪽 벽이 약해져서 변이 질 쪽으로 밀려 나와 잘 안 나오는 거예요."', why:'직장 앞벽을 받치는 직장-질 사이 조직이 약해져 직장 앞벽이 질 쪽으로 밀려 나오는 상태입니다. 여러 번의 질 분만, 나이, 비만, 자궁적출술, 변비·무거운 물건 들기·만성 기침 같은 반복적인 복압 상승이 위험 요인입니다.', s:[4, 1] },
      { t:'힘을 세게 주지 않는 이유', say:'"세게 힘을 줄수록 더 밀려 나와서 변이 더 안 나와요."', why:'배변이 잘 안 되어 과도하게 힘을 주면 약한 부위가 더 돌출되고, 이것이 다시 배변을 어렵게 하는 악순환이 제시됩니다. 화장실에 10분 이상 앉아 있지 않고 과하게 힘주지 않도록 합니다.', s:[4, 2] },
      { t:'손가락으로 받쳐 배변하기', say:'"변이 안 나오면 깨끗한 손가락으로 질 뒤쪽을 살짝 받쳐 주셔도 괜찮아요."', why:'일부 여성은 배변을 위해 질 후벽을 손가락으로 눌러야 합니다. 영국 NHS 안내문은 배변이 어려울 때 깨끗한 손가락이나 엄지로 질 벽을 지지할 수 있다고 안내합니다. 손가락으로 배변을 도와야 하는 경우는 진료가 필요한 단서이기도 합니다.', s:[1, 5, 4] },
      { t:'변비 관리 수치', say:'"채소랑 잡곡을 드시고 물은 하루 1.5~2리터 정도 드세요."', why:'섬유질 하루 15~25g, 수분 1.5~2L, 주 3회 이상 30분 이상 걷기, 아침식사 후 30분 안에 화장실 가기, 좌변기 발밑 받침대가 권장됩니다. 직장류 환자 보존적 치료로는 고섬유식이와 하루 8컵 이상 수분, 하제·좌제 상용 자제가 쓰였습니다.', s:[2, 4] },
      { t:'변비약 주의', say:'"변비약은 계속 드시지 말고 의사와 상의하세요."', why:'자극성 하제(비사코딜·알로에 등)를 오래 쓰면 대장 흑색증, 신경 손상, 약물 의존이 생길 수 있습니다. 마그네슘 제제는 과량 시 고마그네슘혈증 위험이 있어 콩팥 기능이 떨어진 분은 주의합니다.', s:[2] },
      { t:'골반근육 운동', say:'"아랫배와 엉덩이는 힘을 빼고, 항문과 질만 6~8초 조였다 푸세요."', why:'6~8초 수축을 8~10회 1세트로 3번 반복, 주 3~4회. 15~20주 이상, 3~6개월 이상 꾸준히 해야 효과가 있다고 보고됩니다. 과도한 훈련은 피하고, 혼자 제대로 하는지 판단하기 어려우면 병원에서 교육받기를 권합니다. 이미 생긴 탈출을 되돌리지는 못하지만 불편감과 진행 위험을 줄일 수 있습니다.', s:[3, 6] },
      { t:'골반 부담을 줄이는 생활', say:'"무거운 걸 들 때 숨을 참지 마시고, 기침이 오래가면 치료받으세요."', why:'비만, 만성 기침, 무거운 물건 들기, 배변 시 힘주기는 복압을 높여 탈출을 진행시킬 수 있습니다. 힘쓸 때 숨 참지 않기, 꽉 끼는 옷 피하기, 금연이 권장됩니다.', s:[1, 6] },
      { t:'치료 방법', say:'"운동치료로 좋아지는 분이 많고, 안 되면 다른 치료도 있어요."', why:'국내 바이오피드백 연구(대조군 없음)에서 배변곤란 79%→29%, 불완전 배변감 96%→46%로 줄었습니다. 페서리는 증상을 완화하지만 치유하지 않으며 주기적인 세척이 필요합니다. 운동과 페서리로 증상이 지속되면 질 후벽 복원 수술을 고려합니다.', s:[4, 1] },
      { t:'대장암 경고 증상', say:'"변에 피가 나거나 살이 빠지면 꼭 병원에 가 보세요."', why:'혈변, 원인 모를 체중 감소, 빈혈, 대변이 가늘어짐, 특히 고령에서 갑자기 생긴 변비는 대장암 등 기질적 원인을 확인해야 합니다. 3주 이상 변을 보지 못하면 진료가 필요하고, 고령자 변실금은 분변매복을 의심합니다.', s:[2] }
    ]
  },

      { t:'목표 혈압이 사람마다 다른 이유', say:'"어르신은 보통 140/90 아래가 목표인데, 당뇨나 콩팥병이 있으면 더 낮게 잡기도 해요. 선생님(의사)과 정한 숫자를 적어 두세요."', why:'국가건강정보포털: 노인 고혈압 목표는 140/90 미만, 고위험 당뇨병·표적장기 손상·알부민뇨 동반 만성콩팥병은 130/80 미만. 2026년 제6판 진료지침 보도에 따르면 노인은 노쇠·기립성 저혈압·기대여명을 고려해 목표를 개별화합니다.', s:[1, 5] },
      { t:'집에서 잰 혈압 기준이 135/85인 이유', say:'"집에서 잴 때는 135/85가 넘으면 높은 거예요."', why:'가정혈압의 고혈압 기준은 135/85 mmHg 이상으로, 진료실 기준(140/90)과 따로 정해져 있습니다.', s:[1] },
      { t:'아침·저녁 측정 조건', say:'"아침엔 일어나서 1시간 안에, 화장실 다녀와서, 밥과 약 먹기 전에 재세요."', why:'아침: 기상 후 1시간 이내, 소변 후, 아침 식사 전, 혈압약 복용 전, 앉은 자세로 최소 1~2분 안정 후. 저녁: 잠자리에 들기 전.', s:[1] },
      { t:'소금 6g', say:'"국은 건더기 위주로 드시고, 젓갈·장아찌·가공식품은 줄이세요."', why:'권고량은 소금 하루 6g 이하이며, 국물·젓갈·장아찌·가공식품을 줄이도록 안내합니다. 소금 6g은 나트륨 약 2.4g입니다(소금 무게의 약 40%가 나트륨이라는 환산으로 계산한 값이며 원문 숫자는 아닙니다). "티스푼 1개" 같은 환산 표현은 출처를 찾지 못해 쓰지 않았습니다.', s:[1] },
      { t:'운동하면 얼마나 좋아지나요', say:'"꾸준히 걸으시면 위 혈압이 5~7 정도 내려가요."', why:'규칙적인 운동으로 수축기혈압이 5~7 mmHg 정도 내려갑니다. 권고: 주 5회 이상, 하루 30분 이상 유산소 운동.', s:[1, 4] },
      { t:'약을 끊으면 안 되는 이유', say:'"혈압이 좋아진 건 약 덕분이에요. 끊으면 다시 올라갈 수 있어요."', why:'혈압이 조절되어도 임의로 약을 중단하면 다시 상승할 수 있으므로, 감량·중단은 의사와 상의합니다.', s:[1, 2] },
      { t:'뇌졸중이 의심되면 서둘러야 하는 이유', say:'"이웃·손·발·시선 중 하나라도 이상하면 기다리지 말고 바로 119예요."', why:'막힌 혈관을 뚫는 주사는 증상이 생긴 뒤 4.5시간 안에 맞아야 하며, 대한뇌졸중학회는 늦어도 3시간 안에 병원에 도착하도록 권합니다.', s:[3] },
      { t:'꾸준한 재방문이 필요한 이유 (간호사 참고)', say:'—', why:'국내 고혈압 사례관리(방문 3회 + 전화 1회) 연구에서 혈압이 바로 좋아졌지만 6~12개월 뒤 다시 오르는 경향이 있었습니다. 대상이 45~74세로, 노인만 연구한 것은 아닙니다.', s:[6] } ]

    items: [
      { t:'증상이 없어도 검사가 필요한 이유', say:'"콜레스테롤은 높아도 아프지 않아서, 피검사로만 알 수 있어요."', why:'이상지질혈증은 대부분 증상이 없어 정기적인 혈액검사로 확인합니다. 70대 이상 유병률은 70.4%로 매우 흔합니다(2026 진료지침 보도).', s:[1, 6] },
      { t:'진단 기준과 치료 목표는 다릅니다', say:'"검사 기준과 어르신 목표 숫자는 달라요. 목표는 선생님(의사)과 정한 숫자를 보세요."', why:'진단 기준: 총콜레스테롤 200 이상, LDL 130 이상, 중성지방 150 이상, HDL 남 40·여 50 미만. 치료 목표(LDL)는 위험도에 따라 따로 정합니다.', s:[1] },
      { t:'LDL 목표가 사람마다 다른 이유 (간호사 참고)', say:'"심장이나 뇌혈관 병이 있으셨으면 더 낮게 잡아요."', why:'진료지침 제5판(2022) 기준: 관상동맥질환 55 미만, 죽상경화성 뇌졸중·말초동맥질환·위험이 큰 당뇨병 70 미만, 위험인자 2개 이상 130 미만, 1개 이하 160 미만. 2026 개정 지침은 수치는 유지하고 55 미만 적용 대상을 넓혔습니다(보도 기준, 원문 미확인).', s:[2, 6, 7] },
      { t:'피검사 전 금식', say:'"검사 전날 저녁 이후로는 드시지 마세요."', why:'최소 9시간, 권장 12시간 금식 후 채혈합니다.', s:[1] },
      { t:'식사 수칙의 근거', say:'"고기 기름, 튀김, 햄·소시지를 줄이고 생선과 잡곡을 늘리세요."', why:'포화지방은 하루 열량의 7% 미만, 트랜스지방은 되도록 피하고, 식이섬유는 하루 25g 이상 권고됩니다.', s:[1, 2, 3] },
      { t:'술을 줄여야 하는 이유', say:'"술은 피 속 기름(중성지방)을 올려요."', why:'음주는 중성지방을 올립니다. 지침은 하루 1~2잔 이내, 가급적 금주를 권합니다.', s:[2] },
      { t:'약을 꾸준히 드셔야 하는 이유', say:'"수치가 좋아진 건 약 덕분이에요. 끊으면 다시 올라가요."', why:'국내 이상지질혈증 환자의 복약 순응도는 67.4%(2023)로, 3명 중 1명은 꾸준히 복용하지 않습니다. 스타틴을 부적절하게 중단하지 않도록 학회가 안내합니다.', s:[3, 6] },
      { t:'근육통이 생기면', say:'"다리가 쑤시거나 기운이 없으면 약을 끊지 말고 병원에 말씀하세요."', why:'스타틴·피브레이트를 함께 쓰면 근육통·근병증을 주의하고, 고령자나 콩팥 기능이 떨어진 경우 신중히 씁니다. 부작용으로 복용이 어려우면 약을 바꾸거나 다른 약을 더할 수 있습니다.', s:[1, 7] } ]

      { t:'아픈데 왜 운동을 하나요', say:'"허벅지 근육이 튼튼해야 무릎을 받쳐 줘요. 너무 쉬면 근육이 더 약해져요."', why:'허벅지 앞쪽(대퇴사두근) 근력 운동이 무릎 통증을 줄입니다. 지나친 휴식은 근육을 약하게 합니다.', s:[1, 2] },
      { t:'운동을 어느 정도 해야 하나요', say:'"운동하고 몇 분 쉬면 통증이 가라앉을 정도면 괜찮아요. 다음 날까지 아프면 줄이세요."', why:'운동 후 수 분 안에 통증이 사라지는 정도가 적당하며, 다음 날 일상생활이 힘들면 과한 것입니다. 권장: 걷기·수영·실내 자전거 주 3~4회, 하루 30분.', s:[1, 3] },
      { t:'계단과 쪼그려 앉기를 피하는 이유', say:'"계단에서는 무릎에 평지보다 두세 배 무게가 실려요."', why:'계단·가파른 길은 평지보다 무릎 하중이 2~3배 늘어납니다. 양반다리·쪼그려 앉기, 30분 넘게 같은 자세는 피합니다.', s:[3, 4] },
      { t:'체중을 줄이면', say:'"몸무게가 줄면 무릎이 받는 무게가 줄어 덜 아파요. 굶지는 마세요."', why:'체중 감량은 관절 하중을 줄여 통증을 덜고 진행을 늦춥니다. 굶는 방식은 뼈와 관절에 해롭습니다. 감량 목표를 kg 단위로 제시한 근거는 확인한 출처에 없습니다.', s:[1, 2] },
      { t:'냉찜질과 온찜질', say:'"운동하고 열이 나고 부으면 차갑게, 평소 뻣뻣할 땐 따뜻하게 15분 정도 하세요."', why:'운동 후 열감·부종이 있으면 냉찜질, 온찜질은 15분 정도가 알맞습니다. 당뇨병 등 혈관 질환이 있으면 주의합니다. "급성기는 냉, 만성기는 온"이라는 일반 원칙은 확인한 출처에 그 표현으로 나오지 않습니다.', s:[1, 3, 4] },
      { t:'소염진통제를 조심하는 이유', say:'"진통제는 위에서 피가 날 수 있어요. 아스피린이나 와파린을 드시면 꼭 말씀하세요."', why:'NSAIDs는 위출혈 위험이 있으며 60세 이상, 위궤양 과거력, 아스피린·와파린·스테로이드 복용자는 더 위험합니다. 최소 유효 용량을 단기간 씁니다. 두 가지 이상 함께 먹지 않으며, 심부전이 있으면 신장 기능이 나빠질 수 있습니다. 아세트아미노펜은 음주가 잦거나 간이 나쁘면 주의합니다.', s:[1, 2, 7] },
      { t:'관절 주사·줄기세포 문의를 받으면 (간호사 참고)', say:'"주사는 간격을 두고 맞아야 해요. 담당 선생님과 상의하세요."', why:'스테로이드 관절 주사는 3개월보다 짧은 간격이나 1년 3~4회 초과를 피합니다. 줄기세포 치료는 효과가 입증되지 않았습니다.', s:[1] },
      { t:'지팡이를 반대쪽 손으로 잡는 이유', say:'"아픈 다리 반대쪽 손으로 잡고, 지팡이와 아픈 다리를 같이 내딛으세요."', why:'반대쪽 손으로 잡아야 아픈 다리와 지팡이가 함께 체중을 나눠 받습니다. 국내 공식 자료에서 찾지 못해 해외 자료(캐나다)로 보완했습니다.', s:[9] },
      { t:'붓고 뜨거우면 바로 병원에 가야 하는 이유', say:'"갑자기 빨갛게 붓고 뜨거우면서 열이 나면 세균 감염일 수 있어서 바로 병원에 가셔야 해요."', why:'화농성(세균성) 관절염은 치료하지 않으면 사망률이 66%, 치료하면 15%로 보고됩니다. 엉덩이관절이 고열과 함께 심하게 아프면 응급수술이 필요한 경우가 많습니다.', s:[5, 6] } ]
  },
  spine: {
    extra: [],
    items: [
      { t:'협착증은 수술해야 하나요', say:'"허리를 숙이면 편해지는 분이 많고, 절반 정도는 수술 없이 좋아져요."', why:'허리를 숙이면 75% 이상에서 증상이 좋아지고, 약 50%는 수술 없이 호전됩니다. 걸으면 다리가 아프고 앉거나 숙이면 나아지는 것(신경인성 파행)이 특징입니다.', s:[1] },
      { t:'아플 때 누워만 있으면 안 되는 이유', say:'"누워 쉬는 건 2~3일까지만 하시고, 할 수 있는 만큼 움직이세요."', why:'침상 안정은 2~3일을 넘기지 않으며, 가능한 만큼 일상생활로 돌아오는 것이 회복에 도움이 됩니다.', s:[2, 3] },
      { t:'어떤 운동을 얼마나 하나요', say:'"걷기가 제일 좋아요. 허리를 많이 굽히는 일은 피하세요."', why:'노인 권장량: 중강도 유산소 주 150분 이상(10분 미만도 합산), 근력 주 2회 이상, 균형 주 3회 이상. 허리가 아플 때 허리를 굽히는 운동은 증상을 악화시킬 수 있습니다. 달리기보다 걷기가 좋습니다.', s:[2, 7] },
      { t:'바른 자세의 근거', say:'"물건은 무릎을 굽혀 앉아서, 몸에 붙여 드세요."', why:'물건은 무릎을 굽히고 허리를 편 채 몸에 붙여 듭니다. 앉을 때는 등을 등받이에 붙이고 엉덩이 각도는 95도 정도, 오래 서 있을 때는 한쪽 발을 낮은 받침대에 올립니다.', s:[2] },
      { t:'압박골절을 의심하는 신호', say:'"키가 줄었거나 등이 굽었거나, 기침하다가 등이 아팠으면 꼭 알려 주세요."', why:'골다공증이 있으면 허리를 굽히거나 기침만 해도 척추뼈가 부러질 수 있습니다. 키 감소·등 굽음·갑작스러운 등 통증이 신호입니다. 가벼운 낙상 뒤에도 통증이 계속되면 압박골절을 의심합니다.', s:[4, 5] },
      { t:'칼슘·비타민D·햇볕', say:'"우유·멸치 같은 칼슘을 챙기시고, 하루 15분은 햇볕을 쬐세요."', why:'50세 이상 칼슘 하루 800~1,000mg, 비타민D 하루 800~1,000IU, 햇볕 하루 15분. 골다공증이 있으면 걷기 등 체중 부하 운동을 하루 30~60분, 주 3~5일 합니다.', s:[4] },
      { t:'낙상 위험이 높은 분', say:'"드시는 약이 많으면 어지러워 넘어지기 쉬워요. 일어날 땐 천천히요."', why:'약을 4가지 이상 복용하면 낙상 위험이 높아지며, 혈압약·신경안정제·항우울제 복용자는 특히 주의합니다. 국가건강검진에서 54세·66세 여성은 골밀도 검사를 받습니다.', s:[5, 6] },
      { t:'대소변 이상이 응급인 이유', say:'"소변·대변이 잘 안 나오거나 참기 어려우면 바로 병원이에요."', why:'대소변 장애는 마미(말총)증후군일 수 있으며 일찍 수술해야 하는 경우입니다. 다리 힘 빠짐이나 감각 이상이 진행하는 경우, 젓가락질·단추 채우기가 어려워지는 경우(목 척수 압박 의심)도 즉시 진료가 필요합니다. 4~6주가 지나도 낫지 않으면 적극적인 검사를 받습니다.', s:[1, 2, 3] },
      { t:'찜질의 한계', say:'"찜질은 잠깐 통증을 덜어 줄 뿐이에요."', why:'온찜질은 근육 뭉침을 풀고 냉찜질은 감각을 둔하게 해 통증을 줄이지만, 원인을 고치지는 못합니다.', s:[3] } ]
  },
  dm: {
    extra: [
      { org:'메디칼타임즈 (대한당뇨병학회 노인 개별화 지침 보도)', title:'"천편일률 노인 혈당 관리는 독"…당뇨병학회 개별화 지침 마련', year:'2025.9.', url:'https://medicaltimes.com/Mobile/News/NewsView.html?ID=1165418' },
      { org:'미국 질병통제예방센터(CDC)', title:'Managing Sick Days', year:'2024', url:'https://cdc.gov/diabetes/living-with/managing-sick-days.html', foreign:true } ],
    items: [
      { t:'어르신 혈당 목표가 사람마다 다른 이유 (간호사 참고)', say:'"어르신 건강 상태에 맞춰 목표를 정해요. 선생님(의사)께 내 목표를 꼭 여쭤 보세요."', why:'일반 성인 2형 당뇨병의 당화혈색소 목표는 6.5% 미만이지만 고령자는 개별 조정합니다. 국가건강정보포털은 미국당뇨병학회 2025 권고를 인용해 7.0~7.5% 미만 또는 8.0% 미만을 제시합니다. 대한당뇨병학회지 종설(2024)은 노쇠도에 따라 건강 7.0% 미만, 노쇠 전 7.5% 미만, 노쇠 8.0% 미만(저혈당 위험 약을 쓰면 더 완화)을 소개합니다. 자료마다 수치가 달라 안내문에는 개인 목표 칸만 두었습니다.', s:[1, 2, 3, 10] },
      { t:'어르신 저혈당이 더 위험한 이유', say:'"멍하거나 기운이 없기만 해도 저혈당일 수 있어요. 이상하면 바로 재 보세요."', why:'저혈당은 혈당 약 70 mg/dL 이하입니다. 노인은 증상이 모호해 알아차리기 어렵고 회복도 더딥니다. 인슐린·설폰요소제를 쓰면 저혈당 위험이 높습니다.', s:[2, 3, 4] },
      { t:'15-15 규칙', say:'"사탕 5~6개나 주스 2/3컵을 드시고 15분 뒤에 다시 재세요."', why:'포도당·설탕 15g(사과·오렌지주스 2/3컵, 사탕 5~6개, 설탕 1큰술 등)을 먹고 15분 뒤 재측정, 80 mg/dL 미만이면 15g을 한 번 더 먹습니다. 다음 식사까지 1시간 넘게 남았으면 간식을 먹습니다. 원문 본문에는 "10~20분 후"로도 적혀 있습니다.', s:[4] },
      { t:'의식이 없을 때 입에 넣지 않는 이유', say:'"정신이 없으시면 사탕을 억지로 넣지 말고 119를 부르세요."', why:'의식을 잃어 삼키기 어려우면 질식 위험이 있으므로 입에 아무것도 넣지 않고 즉시 응급실로 이송해 포도당 주사를 맞아야 합니다.', s:[4, 7] },
      { t:'빵·떡으로 끼니를 때우면 안 되는 이유', say:'"빵이나 떡으로만 드시면 혈당이 확 올랐다 떨어져요. 고기·생선·두부도 같이 드세요."', why:'끼니를 빵·떡·과일로 대신하면 혈당 변동이 커집니다. 근육이 줄지 않도록 단백질을 챙깁니다. 술은 저혈당을 일으킬 수 있습니다.', s:[2, 5] },
      { t:'운동 수칙의 근거', say:'"빈속엔 운동하지 마시고, 이틀 넘게 쉬지 마세요."', why:'주 150분 이상(주 3일 이상, 이틀 넘게 연속으로 쉬지 않음), 근력 운동 주 2~3회, 오래 앉아 있으면 30분마다 일어나기. 운동 전 혈당이 100 미만이면 당분 15g 간식을 먼저 먹습니다.', s:[8] },
      { t:'발 관리가 중요한 이유', say:'"당뇨가 있으면 발에 상처가 나도 잘 못 느끼고 잘 안 나아요. 매일 봐 주세요."', why:'매일 발과 발가락 사이를 관찰하고, 미지근한 물로 씻고, 발톱은 일자로 깎으며, 굳은살은 직접 제거하지 않고, 온열기구에 발을 대지 않습니다. 1년에 한 번 병원에서 발 검사를 받습니다.', s:[7, 9] },
      { t:'아플 때(감기·설사) 수칙', say:'"아프실 땐 혈당을 더 자주 재고 물을 많이 드세요. 약을 어떻게 할지는 미리 여쭤 두세요."', why:'국내 자료: 아플 때 혈당을 자주 재고 수분을 충분히 섭취, 약 조절은 미리 의사와 정합니다. 해외(CDC): 4시간마다 혈당 측정, 식사가 어려우면 4시간마다 탄수화물 약 50g. 약을 계속 먹을지 여부는 약 종류에 따라 달라 국내 근거로 확인하지 못했습니다.', s:[7, 11] },
      { t:'바로 병원에 가야 하는 기준', say:'"못 드신 지 6시간이 넘거나, 토하는 게 4시간 넘게 계속되면 연락하세요."', why:'6시간 넘게 못 먹음, 구토 4시간 이상, 심한 설사 8시간 이상, 38.3℃ 이상 열이 24시간 이상, 혈당 300 이상이 계속되며 증상이 있을 때. 65세 이상 2형 당뇨병은 고혈당고삼투질상태가 생길 수 있으며, 혈당측정기에 "HIGH"가 뜨면 600 mg/dL 이상입니다.', s:[6, 7] },
      { t:'정기검사', say:'"피검사는 2~3달마다, 눈·콩팥·발 검사는 1년에 한 번씩이요."', why:'당화혈색소 2~3개월마다(최소 연 2회), 안저 검사는 진단 즉시·이후 매년, 소변 알부민·혈액 크레아티닌 매년, 발 검사 매년.', s:[1, 7, 9] } ]
  },
  cancer: {
    extra: [
      { org:'국립암센터 국가암정보센터', title:'암생존자통합지지센터', year:'2026.6. 수정', url:'https://www.cancer.go.kr/lay1/S1T786C841/contents.do' },
      { org:'국립암센터 국가암정보센터', title:'암환자의료비지원사업', year:'2024.2. 수정', url:'https://cancer.go.kr/lay1/S1T559C560/contents.do' },
      { org:'강명희 외, 한국호스피스완화의료학회지 17(4)', title:'재가암환자의 신체 증상들과 정신적, 사회적, 영적, 그리고 경제적 돌봄 요구도', year:'2014', url:'https://scholarworks.gnu.ac.kr/handle/sw.gnu/19486' },
      { org:'영등포구 보건소 (지역 예시)', title:'재가암환자관리사업', year:'', url:'https://www.ydp.go.kr/health/contents.do?key=3547&' } ],
    items: [
      { t:'입맛이 없을 때 조금씩 자주 드시게 하는 이유', say:'"한 번에 많이 못 드셔도 괜찮아요. 조금씩 자주 드세요."', why:'식욕부진 시 조금씩 자주 먹고, 간식을 손 닿는 곳에 두며, 몸 상태가 좋을 때(보통 푹 쉰 아침) 많이 먹습니다. 물은 식사 전후 30~60분에 마시고, 계속 못 먹으면 영양보충음료를 이용합니다. 가족은 억지로 강요하지 않습니다.', s:[1] },
      { t:'단백질을 챙기는 이유', say:'"고기·생선·달걀·두부를 매 끼 조금씩이라도 드세요."', why:'치료 중에는 매 끼 단백질을 먹고, 씹기 어려우면 다지거나 갈아서 먹습니다.', s:[3] },
      { t:'메스꺼울 때', say:'"냄새가 적고 차갑거나 미지근한 음식이 편하실 거예요."', why:'냄새 적은 음식을 차갑거나 미지근하게, 담백한 음식(비스킷·토스트·요구르트), 기름지고 맵고 단 음식은 피합니다. 식후 30분~1시간은 기대어 앉습니다. 구토 12시간 이상, 하루 4컵 이하 수분, 2일 이상 못 먹으면 의료진에게 연락합니다.', s:[2] },
      { t:'38℃ 기준을 강조하는 이유', say:'"항암치료 중에 열이 38도 넘으면 해열제로 버티지 말고 바로 응급실에 가세요."', why:'항암치료 중 체온 38℃ 이상이거나 심한 오한이 있으면 곧바로 응급실로 가야 합니다. ("해열제로 버티지 말라"는 표현은 원문에 없는 권고 문구이며, 원문은 "곧바로 응급실로 가야 합니다"입니다.) 흉통·호흡곤란, 배뇨 시 통증, 입안 궤양, 관 삽입 부위 부종·발적도 의료진과 상담할 상황입니다.', s:[5] },
      { t:'감염 예방 수칙', say:'"밥 먹기 전, 밖에 다녀와서, 화장실 다녀와서 꼭 손을 씻으세요."', why:'손씻기, 사람 많은 곳과 감기 환자 피하기, 부드러운 칫솔로 자주 양치, 항암치료 중 익힌 음식 먹기(날달걀·살균 안 된 우유 피하기). 생과일·생채소 제한 내용도 있으나 2013년 자료이므로 담당의 지시를 따르도록 안내합니다.', s:[4] },
      { t:'진통제를 규칙적으로 드시게 하는 이유', say:'"아플 때까지 참았다가 드시는 것보다 시간 맞춰 드시는 게 더 잘 들어요."', why:'진통제는 정해진 시간에 규칙적으로 복용하고, 통증이 없다고 임의로 끊지 않으며, 다른 사람의 진통제를 쓰지 않습니다. 갑자기 아플 때 쓸 약(돌발통증 약)을 미리 처방받을 수 있습니다.', s:[6] },
      { t:'통증 점수를 적는 이유', say:'"0점(안 아픔)부터 10점(못 참을 만큼)까지 몇 점인지 적어 두세요."', why:'통증은 0~10 숫자통증척도로 자주 평가해 담당 의사에게 알리며, 진통제로 조절되지 않으면 약을 바꿀 수 있습니다.', s:[6, 7] },
